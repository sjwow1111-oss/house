<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#192720"/><link rel="icon" type="image/svg+xml" href="/favicon.svg"/><title>산들 — Three.js 건축 맵</title></head>
<body>
<canvas id="scene" aria-label="산과 정원으로 둘러싸인 현대 주택 3D 맵"></canvas>
<div class="vignette"></div>
<header><a class="brand" href="/">산들<span>SANDEUL · ARCHITECTURAL WORLD</span></a><div class="status"><i></i> LIVE ENVIRONMENT</div></header>
<main class="intro"><div class="eyebrow">01 / THE COUNTRYSIDE RESIDENCE</div><h1>풍경 안에,<br/>머무는 집.</h1><p>산의 능선과 따뜻한 빛 사이.<br/>자연 속 작은 주거 공간을 탐험하세요.</p><div class="tags"><span>37° N, 127° E</span><span>가을 · 맑음</span></div></main>
<aside class="panel"><div class="panel-title">SCENE SETTINGS <span>환경 설정</span></div><label class="label">빛의 시간 <span id="time-label">늦은 오후</span></label><div class="segmented"><button data-time="day">낮</button><button data-time="golden" class="active">오후</button><button data-time="night">밤</button></div><label class="slider-label" for="exposure">노출 <output id="exposure-value">1.0</output></label><input id="exposure" type="range" min="0.5" max="1.6" value="1" step="0.05"/><div class="divider"></div><label class="toggle-row">실내 조명 <input id="lights" type="checkbox" checked/><span class="switch"></span></label><label class="toggle-row">잔디의 움직임 <input id="wind" type="checkbox" checked/><span class="switch"></span></label><button id="reset" class="reset">↺ <span>처음 시점으로</span></button></aside>
<footer><div class="view-buttons"><button id="orbit" class="active">둘러보기 <span>01</span></button><button id="walk">걸어보기 <span>02</span></button></div><div id="hint">드래그하여 회전 <b>·</b> 스크롤하여 확대</div><div class="render-badge">WEBGL / PBR <span id="fps">— FPS</span></div></footer>
<div id="walk-help" hidden><strong>정원을 걸어보세요</strong><p>W A S D 이동 · 마우스 시선 · Shift 빠르게 · Esc 종료</p><button id="enter-walk">탐험 시작 ↗</button></div>
<div id="loading"><span>산들</span><p>풍경을 불러오고 있습니다</p></div>
<div id="error" hidden></div>
<script type="module" src="/src/main.js"></script>
</body></html>
